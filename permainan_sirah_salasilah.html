<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salasilah Rasulullah SAW - Pendidikan Islam Tahun 1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');

        :root {
            --primary: #FF9800;
            --secondary: #03A9F4;
            --success: #4CAF50;
            --danger: #F44336;
            --bg-color: #E1F5FE;
            --card-bg: #FFFFFF;
            --text-main: #333333;
        }

        * {
            box-sizing: border-box;
            font-family: 'Fredoka', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(#B3E5FC 2px, transparent 2px);
            background-size: 30px 30px;
        }

        #app {
            width: 100%;
            max-width: 800px;
            min-height: 100vh;
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Screens */
        .screen {
            display: none;
            padding: 20px;
            flex: 1;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        .screen.active {
            display: flex;
        }

        /* Typography */
        h1 {
            color: var(--secondary);
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #FFF, 4px 4px 0px rgba(0,0,0,0.1);
        }

        h2 {
            color: var(--primary);
            text-align: center;
            font-size: 1.8rem;
        }

        p.instruction {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 20px;
            color: #555;
            background: #FFF9C4;
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px dashed var(--primary);
        }

        /* Buttons */
        button {
            border: none;
            border-radius: 15px;
            padding: 15px 30px;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            margin: 10px;
            color: white;
            text-transform: uppercase;
        }

        button:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 rgba(0,0,0,0.2);
        }

        .btn-start { background-color: var(--success); font-size: 1.5rem; width: 80%; max-width: 300px;}
        .btn-level-1 { background-color: #8BC34A; width: 100%; max-width: 350px;}
        .btn-level-2 { background-color: #29B6F6; width: 100%; max-width: 350px;}
        .btn-level-3 { background-color: #AB47BC; width: 100%; max-width: 350px;}
        .btn-action { background-color: var(--primary); }
        .btn-menu { background-color: var(--secondary); }

        /* Input */
        input[type="text"] {
            font-size: 1.5rem;
            padding: 15px;
            border: 3px solid var(--secondary);
            border-radius: 15px;
            width: 80%;
            max-width: 300px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }
        
        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        /* Top Bar */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: var(--secondary);
            color: white;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 20px;
            background-color: #E0E0E0;
            border-radius: 10px;
            margin: 15px 0;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
        .progress-bar {
            height: 100%;
            background-color: var(--success);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Level 1: Match Game */
        .match-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
            margin-top: 10px;
        }
        .match-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .match-item {
            background-color: white;
            border: 3px solid var(--secondary);
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 var(--secondary);
            user-select: none;
        }
        .match-item:active { transform: translateY(4px); box-shadow: none; }
        .match-item.selected { background-color: #FFF9C4; border-color: var(--primary); box-shadow: 0 4px 0 var(--primary); transform: scale(1.02); }
        .match-item.matched { background-color: #C8E6C9; border-color: var(--success); box-shadow: 0 4px 0 var(--success); color: #2E7D32; opacity: 0.8; pointer-events: none; }

        /* Level 2: Family Tree */
        .tree-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 20px;
            margin-bottom: 20px;
            background: #f1f8e9;
            padding: 15px;
            border-radius: 20px;
            border: 2px dashed #8bc34a;
        }
        .tree-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }
        @media (max-width: 500px) {
            .tree-row { gap: 10px; }
        }
        .tree-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            position: relative;
        }
        .tree-side-parents {
            display: flex;
            gap: 10px;
        }
        .tree-box {
            width: 85px;
            height: 70px;
            background-color: white;
            border: 3px solid #ccc;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 0 #ccc;
            padding: 5px;
            transition: all 0.2s;
            position: relative;
        }
        .tree-box.active { border-color: var(--primary); box-shadow: 0 4px 0 var(--primary), 0 0 15px var(--primary); transform: scale(1.1); }
        .tree-box.filled { border-color: var(--success); box-shadow: 0 4px 0 var(--success); background-color: #E8F5E9; }
        .tree-box-title { position: absolute; top: -20px; font-size: 0.8rem; color: #555; background: #eee; padding: 2px 8px; border-radius: 10px; white-space: nowrap;}
        
        .muhammad-box {
            width: 200px;
            height: 60px;
            background: linear-gradient(135deg, #FFD54F, #FFB300);
            border: 3px solid #FF8F00;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            margin-top: 10px;
            transition: all 0.5s;
        }
        .muhammad-box.glow {
            box-shadow: 0 0 20px #FFC107, 0 0 40px #FFEB3B;
            animation: pulse 1.5s infinite;
        }
        .choices-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: #FFF3E0;
            border-radius: 15px;
            border: 2px dashed var(--primary);
        }
        .choice-card {
            background-color: white;
            border: 2px solid var(--primary);
            border-radius: 10px;
            padding: 10px 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--primary);
        }
        .choice-card:active { transform: translateY(3px); box-shadow: none; }
        .choice-card.used { opacity: 0.5; pointer-events: none; background: #eee; border-color: #ccc; box-shadow: none; }

        /* Level 3: Form */
        .form-section {
            width: 100%;
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            text-align: left;
        }
        .form-section h3 {
            color: var(--primary);
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .question-group {
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        .question-group input {
            font-size: 1.1rem;
            padding: 8px;
            width: 200px;
            margin: 5px 0;
            border: 2px solid #ccc;
            border-radius: 8px;
        }
        .question-group input.correct { border-color: var(--success); background-color: #E8F5E9; }
        .question-group input.wrong { border-color: var(--danger); background-color: #FFEBEE; }
        .question-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 1.1rem;
            margin-top: 5px;
            resize: none;
        }

        /* Mascot & Modal */
        .mascot-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            z-index: 10;
            transition: transform 0.3s;
            display: none;
        }
        .mascot-container.show { display: block; animation: bounceIn 0.5s; }
        
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
            width: 400px;
            transform: scale(0.8);
            transition: transform 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-icon { font-size: 4rem; margin-bottom: 10px; }
        .modal-title { font-size: 1.8rem; margin-bottom: 10px; color: var(--primary); }
        .modal-msg { font-size: 1.2rem; margin-bottom: 20px; color: #555; }

        /* Result Screen */
        .stars-container {
            font-size: 4rem;
            color: #ccc;
            margin: 20px 0;
            text-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }
        .stars-container .earned { color: #FFC107; animation: popIn 0.5s; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes bounceIn { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        @keyframes popIn { 0% { transform: scale(0) rotate(-20deg); } 80% { transform: scale(1.2) rotate(10deg); } 100% { transform: scale(1) rotate(0); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .shake-anim { animation: shake 0.3s; }

    </style>
</head>
<body>

<div id="app">
    <!-- Top Bar (Hidden on Start/Menu) -->
    <div class="top-bar" id="top-bar" style="display: none;">
        <span id="player-name-display">Murid</span>
        <span id="score-display">⭐ 0</span>
    </div>

    <!-- Screen 1: Start -->
    <div id="screen-start" class="screen active">
        <div style="font-size: 5rem; margin-top: 20px;">🕌</div>
        <h1>Salasilah Rasulullah SAW</h1>
        <p style="font-size: 1.2rem; color: #666; margin-bottom: 30px;">Pendidikan Islam Tahun 1</p>
        
        <h2>Siapa nama kamu?</h2>
        <input type="text" id="player-name" placeholder="Masukkan nama..." autocomplete="off">
        <button class="btn-start" onclick="startGame()">Mula Main!</button>
    </div>

    <!-- Screen 2: Main Menu -->
    <div id="screen-menu" class="screen">
        <h1 style="margin-top: 20px;">Pilih Tahap</h1>
        <p style="font-size: 1.2rem; text-align: center;">Mari belajar tentang keluarga Nabi Muhammad SAW!</p>
        
        <button class="btn-level-1" onclick="loadLevel(1)">
            <span style="display:block; font-size: 1.5rem;">Tahap 1</span>
            <span style="font-size: 1rem; font-weight:normal;">Pemulihan (Padankan)</span>
        </button>
        <button class="btn-level-2" onclick="loadLevel(2)">
            <span style="display:block; font-size: 1.5rem;">Tahap 2</span>
            <span style="font-size: 1rem; font-weight:normal;">Sederhana (Carta Salasilah)</span>
        </button>
        <button class="btn-level-3" onclick="loadLevel(3)">
            <span style="display:block; font-size: 1.5rem;">Tahap 3</span>
            <span style="font-size: 1rem; font-weight:normal;">Pengayaan (Tulis Jawapan)</span>
        </button>
    </div>

    <!-- Screen 3: Level Container -->
    <div id="screen-level" class="screen">
        <h2 id="level-title">Tahap</h2>
        <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
        <p class="instruction" id="level-instruction">Arahan</p>
        
        <div id="level-content" style="width: 100%;">
            <!-- Content injected via JS -->
        </div>

        <button id="btn-submit-level" class="btn-action" style="display:none; margin-top: 20px; width:80%;" onclick="checkLevel3()">Semak Jawapan</button>
    </div>

    <!-- Screen 4: Results -->
    <div id="screen-result" class="screen">
        <h1 style="font-size: 3rem;">Tahniah!</h1>
        <h2 id="result-name">Nama</h2>
        
        <div class="stars-container" id="result-stars">
            ★★★
        </div>
        <p id="result-msg" style="font-size: 1.3rem; text-align: center; margin-bottom: 30px;">Kamu telah menyelesaikan tahap ini dengan cemerlang!</p>
        
        <button class="btn-start" onclick="showScreen('screen-menu')">Kembali ke Menu</button>
    </div>

    <!-- Mascot -->
    <div class="mascot-container" id="mascot">
        <!-- SVG Cute Star -->
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 5 L63 35 L95 35 L69 55 L79 85 L50 65 L21 85 L31 55 L5 35 L37 35 Z" fill="#FFC107" stroke="#FF9800" stroke-width="4"/>
            <circle cx="40" cy="45" r="5" fill="#333"/>
            <circle cx="60" cy="45" r="5" fill="#333"/>
            <path d="M45 55 Q 50 65 55 55" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
    </div>

    <!-- Custom Modal -->
    <div class="modal-overlay" id="custom-modal">
        <div class="modal-box">
            <div class="modal-icon" id="modal-icon">⭐</div>
            <h2 class="modal-title" id="modal-title">Tajuk</h2>
            <p class="modal-msg" id="modal-msg">Mesej</p>
            <button class="btn-action" onclick="closeModal()" id="modal-btn">Teruskan</button>
        </div>
    </div>
</div>

<script>
    // Game State
    let playerName = "";
    let totalScore = 0;
    let currentLevel = 1;
    let audioCtx = null;
    
    // Level 1 State
    let level1Data = [
        { id: '1', role: 'Bapa Rasulullah SAW', answer: 'Abdullah' },
        { id: '2', role: 'Ibu Rasulullah SAW', answer: 'Aminah' },
        { id: '3', role: 'Datuk Sebelah Bapa', answer: 'Abdul Muttalib' },
        { id: '4', role: 'Nenek Sebelah Bapa', answer: 'Fatimah' },
        { id: '5', role: 'Datuk Sebelah Ibu', answer: 'Wahab' },
        { id: '6', role: 'Nenek Sebelah Ibu', answer: 'Barrah' }
    ];
    let selectedRole = null;
    let selectedName = null;
    let matchedCount = 0;

    // Level 2 State
    let activeTreeBox = null;
    let treeCompleted = 0;

    // Level 3 State
    let level3Attempts = 0;

    // --- Core Functions ---
    function initAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'win') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.2); 
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.4); 
            osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.6); 
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
            osc.start();
            osc.stop(audioCtx.currentTime + 1);
        }
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        
        if(screenId === 'screen-start' || screenId === 'screen-menu') {
            document.getElementById('top-bar').style.display = screenId === 'screen-menu' ? 'flex' : 'none';
        } else {
            document.getElementById('top-bar').style.display = 'flex';
        }
        document.getElementById('mascot').classList.remove('show');
    }

    function startGame() {
        initAudio();
        const nameInput = document.getElementById('player-name').value.trim();
        if(nameInput === "") {
            showModal("Alamak!", "Sila masukkan nama kamu dahulu.", "❌");
            return;
        }
        playerName = nameInput;
        document.getElementById('player-name-display').innerText = "Murid: " + playerName;
        showScreen('screen-menu');
    }

    function updateScore(points) {
        totalScore += points;
        document.getElementById('score-display').innerText = "⭐ " + totalScore;
    }

    function updateProgress(percent) {
        document.getElementById('progress-bar').style.width = percent + '%';
    }

    // Modal System
    function showModal(title, msg, icon, callback) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-msg').innerText = msg;
        document.getElementById('modal-icon').innerText = icon || "⭐";
        const overlay = document.getElementById('custom-modal');
        overlay.classList.add('active');
        
        const btn = document.getElementById('modal-btn');
        btn.onclick = function() {
            closeModal();
            if(callback) callback();
        };
    }

    function closeModal() {
        document.getElementById('custom-modal').classList.remove('active');
    }

    function showMascot() {
        const mascot = document.getElementById('mascot');
        mascot.classList.add('show');
        setTimeout(() => mascot.classList.remove('show'), 2000);
    }

    function levelComplete(starsEarned) {
        playSound('win');
        setTimeout(() => {
            showScreen('screen-result');
            document.getElementById('result-name').innerText = "Hebat, " + playerName + "!";
            let starsHTML = "";
            for(let i=0; i<3; i++) {
                if(i < starsEarned) starsHTML += `<span class="earned">★</span>`;
                else starsHTML += `<span>★</span>`;
            }
            document.getElementById('result-stars').innerHTML = starsHTML;
        }, 1000);
    }

    // --- LEVEL 1: Pemulihan (Match) ---
    function loadLevel(level) {
        currentLevel = level;
        document.getElementById('btn-submit-level').style.display = 'none';
        showScreen('screen-level');
        updateProgress(0);
        
        const content = document.getElementById('level-content');
        content.innerHTML = '';

        if(level === 1) {
            document.getElementById('level-title').innerText = "Tahap 1: Pemulihan";
            document.getElementById('level-instruction').innerText = "Ketik peranan di sebelah kiri, kemudian ketik nama yang betul di sebelah kanan untuk memadankannya.";
            buildLevel1(content);
        } else if (level === 2) {
            document.getElementById('level-title').innerText = "Tahap 2: Sederhana";
            document.getElementById('level-instruction').innerText = "Ketik kotak kosong pada carta, kemudian ketik nama di bawah untuk mengisinya.";
            buildLevel2(content);
        } else if (level === 3) {
            document.getElementById('level-title').innerText = "Tahap 3: Pengayaan";
            document.getElementById('level-instruction').innerText = "Tuliskan jawapan yang betul di ruang kosong yang disediakan.";
            document.getElementById('btn-submit-level').style.display = 'block';
            buildLevel3(content);
        }
    }

    function buildLevel1(container) {
        matchedCount = 0;
        selectedRole = null;
        selectedName = null;

        let names = [...level1Data].sort(() => Math.random() - 0.5);

        let html = `<div class="match-container">
            <div class="match-column" id="roles-col">
                ${level1Data.map(item => `<div class="match-item role-item" data-id="${item.id}" onclick="selectRole(this, '${item.id}')">${item.role}</div>`).join('')}
            </div>
            <div class="match-column" id="names-col">
                ${names.map(item => `<div class="match-item name-item" data-answer="${item.answer}" onclick="selectName(this, '${item.answer}')">${item.answer}</div>`).join('')}
            </div>
        </div>`;
        container.innerHTML = html;
    }

    function selectRole(el, id) {
        if(el.classList.contains('matched')) return;
        document.querySelectorAll('.role-item').forEach(e => e.classList.remove('selected'));
        el.classList.add('selected');
        selectedRole = { el, id };
        checkMatch1();
    }

    function selectName(el, answer) {
        if(el.classList.contains('matched')) return;
        document.querySelectorAll('.name-item').forEach(e => e.classList.remove('selected'));
        el.classList.add('selected');
        selectedName = { el, answer };
        checkMatch1();
    }

    function checkMatch1() {
        if(selectedRole && selectedName) {
            let correctData = level1Data.find(d => d.id === selectedRole.id);
            if(correctData.answer === selectedName.answer) {
                // Correct
                playSound('correct');
                showMascot();
                selectedRole.el.classList.remove('selected');
                selectedRole.el.classList.add('matched');
                selectedName.el.classList.remove('selected');
                selectedName.el.classList.add('matched');
                updateScore(10);
                matchedCount++;
                updateProgress((matchedCount / 6) * 100);
                
                selectedRole = null;
                selectedName = null;

                if(matchedCount === 6) {
                    setTimeout(() => levelComplete(3), 500);
                }
            } else {
                // Wrong
                playSound('wrong');
                selectedRole.el.classList.add('shake-anim');
                selectedName.el.classList.add('shake-anim');
                setTimeout(() => {
                    selectedRole.el.classList.remove('shake-anim', 'selected');
                    selectedName.el.classList.remove('shake-anim', 'selected');
                    selectedRole = null;
                    selectedName = null;
                }, 300);
                showModal("Cuba Lagi!", "Padanan kurang tepat. Sila cuba lagi ya.", "💡");
            }
        }
    }

    // --- LEVEL 2: Sederhana (Tree) ---
    function buildLevel2(container) {
        treeCompleted = 0;
        activeTreeBox = null;
        let choices = ["Aminah", "Fatimah", "Abdul Muttalib", "Abdullah", "Wahab", "Barrah"].sort(() => Math.random() - 0.5);

        let html = `
        <div class="tree-container">
            <!-- Row 1: Grandparents -->
            <div class="tree-row">
                <div class="tree-side">
                    <div style="font-weight:bold; color:var(--primary); margin-bottom:5px;">Sebelah Bapa</div>
                    <div class="tree-side-parents">
                        <div class="tree-box" id="box-1" data-answer="Abdul Muttalib" onclick="activateTreeBox(this)"><div class="tree-box-title">Datuk (1)</div><span>?</span></div>
                        <div class="tree-box" id="box-2" data-answer="Fatimah" onclick="activateTreeBox(this)"><div class="tree-box-title">Nenek (2)</div><span>?</span></div>
                    </div>
                    <div style="font-size:1.5rem; color:#888;">↓</div>
                    <div class="tree-box" id="box-3" data-answer="Abdullah" onclick="activateTreeBox(this)"><div class="tree-box-title">Bapa (3)</div><span>?</span></div>
                </div>
                
                <div class="tree-side">
                    <div style="font-weight:bold; color:var(--secondary); margin-bottom:5px;">Sebelah Ibu</div>
                    <div class="tree-side-parents">
                        <div class="tree-box" id="box-4" data-answer="Wahab" onclick="activateTreeBox(this)"><div class="tree-box-title">Datuk (4)</div><span>?</span></div>
                        <div class="tree-box" id="box-5" data-answer="Barrah" onclick="activateTreeBox(this)"><div class="tree-box-title">Nenek (5)</div><span>?</span></div>
                    </div>
                    <div style="font-size:1.5rem; color:#888;">↓</div>
                    <div class="tree-box" id="box-6" data-answer="Aminah" onclick="activateTreeBox(this)"><div class="tree-box-title">Ibu (6)</div><span>?</span></div>
                </div>
            </div>
            
            <!-- Row 3: Prophet -->
            <div style="display:flex; gap:50px; font-size:1.5rem; color:#888; margin-top:-10px;"><span>↘</span><span>↙</span></div>
            <div class="muhammad-box" id="muhammad-box">Nabi Muhammad SAW</div>
        </div>

        <div class="choices-container" id="choices-container">
            ${choices.map(c => `<div class="choice-card" onclick="selectChoice(this, '${c}')">${c}</div>`).join('')}
        </div>
        `;
        container.innerHTML = html;
    }

    function activateTreeBox(el) {
        if(el.classList.contains('filled')) return;
        document.querySelectorAll('.tree-box').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        activeTreeBox = el;
    }

    function selectChoice(el, choiceText) {
        if(!activeTreeBox) {
            showModal("Pilih Kotak", "Sila ketik mana-mana kotak kosong pada carta salasilah terlebih dahulu.", "👆");
            return;
        }

        let expectedAnswer = activeTreeBox.getAttribute('data-answer');
        
        if(choiceText === expectedAnswer) {
            // Correct
            playSound('correct');
            showMascot();
            activeTreeBox.innerHTML = `<div class="tree-box-title">${activeTreeBox.querySelector('.tree-box-title').innerText}</div>${choiceText}`;
            activeTreeBox.classList.remove('active');
            activeTreeBox.classList.add('filled');
            el.classList.add('used');
            
            updateScore(10);
            treeCompleted++;
            updateProgress((treeCompleted / 6) * 100);
            activeTreeBox = null;

            if(treeCompleted === 6) {
                document.getElementById('muhammad-box').classList.add('glow');
                setTimeout(() => levelComplete(3), 1500);
            }
        } else {
            // Wrong
            playSound('wrong');
            activeTreeBox.classList.add('shake-anim');
            setTimeout(() => activeTreeBox.classList.remove('shake-anim'), 300);
            showModal("Cuba Lagi!", "Nama tersebut tidak sesuai untuk kotak ini.", "💡");
        }
    }

    // --- LEVEL 3: Pengayaan (Type Answers) ---
    function buildLevel3(container) {
        level3Attempts = 0;
        let html = `
        <div class="form-section">
            <h3>Bahagian A: Melengkapkan Salasilah Keturunan</h3>
            <p>Tuliskan nama ahli keluarga Rasulullah SAW yang betul:</p>
            <ol>
                <li class="question-group">Bapa Rasulullah SAW bernama <input type="text" id="ans-a1" data-ans="abdullah" autocomplete="off"></li>
                <li class="question-group">Ibu Rasulullah SAW bernama <input type="text" id="ans-a2" data-ans="aminah" autocomplete="off"></li>
                <li class="question-group">Datuk sebelah bapa Baginda bernama <input type="text" id="ans-a3" data-ans="abdul muttalib" autocomplete="off"></li>
                <li class="question-group">Nenek sebelah bapa Baginda bernama <input type="text" id="ans-a4" data-ans="fatimah" autocomplete="off"></li>
                <li class="question-group">Datuk sebelah ibu Baginda bernama <input type="text" id="ans-a5" data-ans="wahab" autocomplete="off"></li>
                <li class="question-group">Nenek sebelah ibu Baginda bernama <input type="text" id="ans-a6" data-ans="barrah" autocomplete="off"></li>
            </ol>
        </div>
        
        <div class="form-section">
            <h3>Bahagian B: Keturunan & Refleksi Diri</h3>
            <ol>
                <li class="question-group">Rasulullah SAW berasal daripada keturunan bangsa <input type="text" id="ans-b1" data-ans="arab|quraisy" autocomplete="off"></li>
                <li class="question-group">Tempat lahir Baginda terletak di kota <input type="text" id="ans-b2" data-ans="mekah|makkah" autocomplete="off"></li>
                <li class="question-group">
                    <strong>Penerapan Nilai:</strong> Tuliskan satu amalan baik yang boleh kamu lakukan untuk menunjukkan rasa sayang kepada ahli keluarga kamu:
                    <textarea id="ans-b3" rows="3" placeholder="Contoh: Saya akan selalu menolong ibu di dapur..."></textarea>
                </li>
            </ol>
        </div>
        `;
        container.innerHTML = html;
    }

    function checkLevel3() {
        level3Attempts++;
        let allCorrect = true;
        let inputsToCheck = [
            'ans-a1', 'ans-a2', 'ans-a3', 'ans-a4', 'ans-a5', 'ans-a6',
            'ans-b1', 'ans-b2'
        ];

        inputsToCheck.forEach(id => {
            let el = document.getElementById(id);
            let val = el.value.trim().toLowerCase().replace(/\s+/g, ' ');
            let expected = el.getAttribute('data-ans').split('|');
            
            el.classList.remove('correct', 'wrong');
            
            if(expected.includes(val)) {
                el.classList.add('correct');
                el.readOnly = true;
            } else {
                el.classList.add('wrong');
                allCorrect = false;
            }
        });

        let refEl = document.getElementById('ans-b3');
        let refVal = refEl.value.trim();
        if(refVal === "") {
            refEl.style.borderColor = "var(--danger)";
            allCorrect = false;
        } else {
            refEl.style.borderColor = "var(--success)";
        }

        if(allCorrect) {
            playSound('correct');
            showMascot();
            updateScore(30);
            updateProgress(100);
            showModal("Syabas!", "Amalan yang baik! Semua jawapan kamu tepat.", "🌟", () => levelComplete(3));
        } else {
            playSound('wrong');
            if(level3Attempts < 2) {
                showModal("Cuba lagi ya!", "Terdapat beberapa ejaan atau jawapan yang belum tepat. Semak semula kotak berwarna merah.", "✍️");
            } else {
                // Auto fill answers after 2 failed attempts
                inputsToCheck.forEach(id => {
                    let el = document.getElementById(id);
                    if(!el.classList.contains('correct')) {
                        el.value = el.getAttribute('data-ans').split('|')[0].replace(/\b\w/g, l => l.toUpperCase());
                        el.classList.remove('wrong');
                        el.classList.add('correct');
                        el.readOnly = true;
                    }
                });
                if(refVal === "") refEl.value = "Saling hormat-menghormati";
                
                showModal("Ini Jawapannya", "Jangan putus asa! Cikgu telah bantu betulkan ejaan dan jawapan kamu.", "📚", () => levelComplete(2));
            }
        }
    }
</script>

</body>
</html>
